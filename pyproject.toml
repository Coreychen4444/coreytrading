[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "coreytrading"
version = "0.1.0"
description = "A deterministic, broker-agnostic trading-system reference pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["trading", "risk", "portfolio", "signals", "execution"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Coreychen4444/coreytrading"

[tool.hatch.build.targets.wheel]
packages = ["src/coreytrading"]
